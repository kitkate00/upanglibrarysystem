<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | PHINMA UPang Library</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/alerts.css">
    <link rel="stylesheet" href="assets/css/site.css">
  </head>
  <body class="auth-page">
    <div class="campus-background" aria-hidden="true"><img src="assets/images/phinma-upang-campus.png" alt=""></div>
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="index.html"><span><strong>PHINMA</strong> University of Pangasinan<small>School Library System</small></span></a>
        <nav aria-label="Main navigation"><a href="index.html">Home</a><a class="btn btn-yellow" href="login.html">Log in</a></nav>
      </div>
    </header>
    <main class="wrap auth-main">
      <section class="form-card">
        <h2>Student registration</h2>
        <label>Student number<input type="text" placeholder="e.g. 21-1234-567" maxlength="20"></label>
        <label>Full name<input type="text" placeholder="Full name" maxlength="100"></label>
        <label>Course / Program<input type="text" placeholder="e.g. BS Information Technology" maxlength="60"></label>
        <label>School email<input type="email" placeholder="name@example.edu.ph" maxlength="120"></label>
        <label>Contact number<input type="tel" placeholder="+63 9XXXXXXXXX" maxlength="10"></label>
        <label>Address<textarea rows="3" placeholder="Address" maxlength="250"></textarea></label>
        <label>Password<input type="password" placeholder="At least 8 characters" minlength="8"></label>
        <label>Confirm password<input type="password" placeholder="Confirm password" minlength="8"></label>
        <button class="btn btn-green" type="button">Create account</button>
        <p class="alt">Already registered? <a href="login.html">Log in</a></p>
      </section>
    </main>
    <footer class="site-footer"><div class="wrap"><p>PHINMA University of Pangasinan Library &middot; Open Monday to Saturday, 7:30 AM &ndash; 6:00 PM</p></div></footer>
  </body>
</html>
