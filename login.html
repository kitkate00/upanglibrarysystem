<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | PHINMA UPang Library</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/alerts.css">
    <link rel="stylesheet" href="assets/css/site.css">
  </head>
  <body class="auth-page">
    <div class="campus-background" aria-hidden="true"><img src="assets/images/phinma-upang-campus.png" alt=""></div>
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="index.html"><span><strong>PHINMA</strong> University of Pangasinan<small>School Library System</small></span></a>
        <nav aria-label="Main navigation"><a href="index.html">Home</a><a class="btn btn-yellow" href="register.html">Register</a></nav>
      </div>
    </header>
    <main class="wrap auth-main">
      <section class="form-card">
        <h2>Student log in</h2>
        <label>Student number<input type="text" autocomplete="username" placeholder="Student number"></label>
        <label>Password<input type="password" autocomplete="current-password" placeholder="Password"></label>
        <button class="btn btn-green" type="button">Log in</button>
        <p class="alt">New student? <a href="register.html">Register here</a></p>
        <p class="alt"><a href="student-portal.html">Student dashboard</a></p>
      </section>
    </main>
    <footer class="site-footer"><div class="wrap"><p>PHINMA University of Pangasinan Library &middot; Open Monday to Saturday, 7:30 AM &ndash; 6:00 PM</p></div></footer>
  </body>
</html>
